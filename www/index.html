<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1f44">
<title>Stock Issuing</title>
<style>
:root{--bg:#0a1f44;--card:#12305f;--card2:#183b72;--line:#2a508c;--txt:#eaf1ff;--mut:#9db4dc;--acc:#4da3ff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Calibri,Carlito,"Segoe UI",Roboto,sans-serif;font-size:17px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#top{padding:10px 16px;background:#071634;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
#top b{font-size:19px} #top span{color:var(--mut);font-size:14px}
#banner{background:var(--warn);color:#2a1f00;padding:10px 16px;font-weight:600}
main{flex:1;overflow-y:auto;padding:14px 14px 24px}
nav{display:flex;background:#071634;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px 7px;font:inherit;font-size:12.5px}
nav button i{display:block;font-style:normal;font-size:21px;line-height:1.1}
nav button.on{color:var(--acc);font-weight:700}
label{display:block;margin:12px 0 5px;color:var(--mut);font-size:14px}
input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0c2753;color:var(--txt);font:inherit;font-size:17px}
input:focus,select:focus{outline:2px solid var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1}
button.pri,button.sec,button.dng{padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;font-size:17px;width:100%;margin-top:14px}
button.pri{background:var(--acc);color:#04204a}button.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}button.dng{background:#5a1f2b;color:#ffd6d6}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:300px;overflow-y:auto}
.res div{padding:11px 12px;border-bottom:1px solid var(--line)}.res div:last-child{border:0}.res div:active{background:var(--card2)}
.sm{color:var(--mut);font-size:14px}.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:3px 4px 0 0;font-size:13px}
.day{margin:18px 0 4px;color:var(--acc);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok)}
h3{margin:18px 0 4px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:10px 12px}summary{font-weight:700}
.x{float:right;background:none;border:0;color:var(--bad);font-size:20px;padding:0 6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#e8f1ff;color:#06204a;padding:11px 18px;border-radius:24px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(3,10,26,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
#modal[hidden],#banner[hidden]{display:none}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div id="banner" hidden></div>
  <main id="view"></main>
  <nav id="tabs">
    <button data-t="issue"><i>&#9998;</i>Issue</button>
    <button data-t="log"><i>&#9776;</i>Log</button>
    <button data-t="stock"><i>&#128230;</i>Stock</button>
    <button data-t="set"><i>&#9881;</i>Settings</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" hidden></div>
<script src="xlsx.mini.min.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const nice=s=>{const [y,m,d]=s.split('-');return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y};
const num=n=>(Math.round(n*1000)/1000).toLocaleString('en-US');
const KEY='stockissuing.v1';
const DEF={sites:[],active:'',dirty:[],settings:{projects:['General'],method:'mail',sentMail:{},email:'',webhook:'',secret:'',sendTime:'17:30',lastSent:''},items:[],issues:[],draft:{date:'',project:''}};
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S=Object.assign({},DEF,S);S.settings=Object.assign({},DEF.settings,S.settings);S.draft=Object.assign({},DEF.draft,S.draft);
if(S.settings.sendTime==='17:00')S.settings.sendTime='17:30';
if(!Array.isArray(S.sites))S.sites=[];
if(!Array.isArray(S.dirty))S.dirty=[];
if(!S.settings.sentMail)S.settings.sentMail={};
if(S.settings.site&&!S.sites.length){S.sites.push({name:S.settings.site,items:S.items||[]});S.active=S.settings.site}
if(!S.sites.some(x=>x.name===S.active))S.active=S.sites.length?S.sites[0].name:'';
S.issues.forEach(i=>{if(!i.site)i.site=S.active});
S.items=S.active?S.sites.find(x=>x.name===S.active).items:[];
function activeSite(){return S.sites.find(x=>x.name===S.active)}
function setItems(a){activeSite().items=a;S.items=a}
function setActive(n){S.active=n;S.items=activeSite().items;reindex();sel=null}
function addSite(n){n=n.trim();if(!n)return false;if(S.sites.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast('That site already exists');return false}S.sites.push({name:n,items:[]});setActive(n);save();return true}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},S,{items:undefined})))}catch(e){toast('Phone storage is full')}};
let IDX=[];const reindex=()=>{IDX=S.items.map(i=>(i.c+' '+i.n).toLowerCase())};reindex();
function find(q,limit){const w=q.toLowerCase().split(/\s+/).filter(Boolean),out=[];
  for(let i=0;i<S.items.length&&out.length<limit;i++){let ok=true;for(const x of w){if(IDX[i].indexOf(x)<0){ok=false;break}}if(ok)out.push(i)}return out}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2300)}
function modal(html,btns){const m=$('#modal');m.innerHTML='<div class="box">'+html+btns.map((b,i)=>'<button class="'+b.c+'" data-b="'+i+'">'+b.t+'</button>').join('')+'</div>';m.hidden=false;
  m.onclick=e=>{const b=e.target.closest('[data-b]');if(b){m.hidden=true;const f=btns[+b.dataset.b].f;f&&f()}else if(e.target===m)m.hidden=true}}
if(!S.draft.date)S.draft.date=today();

/* ---------- state ---------- */
let tab='issue',sel=null,lf=today(),lt=today();

/* ---------- views ---------- */
function header(){$('#top').innerHTML='<b>Stock Issuing</b><span>'+esc(S.active||'Set up')+'</span>';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function render(){header();$('#tabs').style.display=S.active?'flex':'none';if(!S.active){vSetup();$('#banner').hidden=true;return}({issue:vIssue,log:vLog,stock:vStock,set:vSet})[tab]();checkBanner()}
function vSetup(){$('#view').innerHTML='<div class="card"><b>Welcome</b><br><span class="sm">Set up this device. Add the site you are issuing stock from. You can add more sites later in Settings.</span></div>'+
  '<label>Site name</label><input id="n_site" placeholder="e.g. Mombasa Depot" autocomplete="off">'+
  '<button class="pri" id="n_go">Start</button>';
  $('#n_go').onclick=()=>{if(!$('#n_site').value.trim()){toast('Enter the site name');return}if(addSite($('#n_site').value)){save();tab='stock';render();toast('Site added - now upload your stock')}}}

function vIssue(){const d=S.draft,v=$('#view');
  v.innerHTML=
  '<div class="row"><div><label>Date</label><input type="date" id="d_date" value="'+esc(d.date)+'"></div>'+
  '<div><label>Project Code (ref)</label><input id="d_proj" list="pcodes" value="'+esc(d.project)+'" autocomplete="off" autocapitalize="characters"><datalist id="pcodes">'+[...new Set(S.issues.map(x=>x.project))].sort().map(p=>'<option value="'+esc(p)+'">').join('')+'</datalist></div></div>'+
  '<label>Item (search by name or product code)</label><input type="search" id="q" placeholder="e.g. bolt 12  or  B001" autocomplete="off">'+
  '<div id="res"></div><div id="pick"></div>'+
  '<div class="row"><div><label>Quantity</label><input id="qty" type="number" inputmode="decimal" min="0" step="any"></div>'+
  '<div><label>Remarks</label><input id="rem" autocomplete="off"></div></div>'+
  '<button class="pri" id="save">SAVE ISSUE</button>';
  $('#d_date').oninput=e=>{d.date=e.target.value;save()};$('#d_proj').oninput=e=>{d.project=e.target.value;save()};
  $('#q').oninput=showRes;$('#save').onclick=saveIssue;showPick();
  if(!S.items.length)$('#res').innerHTML='<div class="card sm">No stock loaded yet. Open the Stock tab and upload your item list.</div>'}
function showRes(){const q=$('#q').value.trim(),r=$('#res');if(!q){r.innerHTML='';return}
  const m=find(q,40);r.innerHTML=m.length?'<div class="res">'+m.map(i=>'<div data-i="'+i+'"><b>'+esc(S.items[i].n)+'</b><br><span class="sm">'+esc(S.items[i].c)+' &middot; stock '+num(S.items[i].q)+' '+esc(S.items[i].u)+'</span></div>').join('')+'</div>':'<div class="card sm">No match</div>';
  r.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{sel=+e.dataset.i;$('#q').value='';r.innerHTML='';showPick();$('#qty').focus()})}
function showPick(){const p=$('#pick');if(sel==null||!S.items[sel]){p.innerHTML='';return}const i=S.items[sel];
  p.innerHTML='<div class="card"><button class="x" id="clr">&times;</button><b>'+esc(i.n)+'</b><br><span class="sm">'+esc(i.c)+' &middot; in stock: <b class="'+(i.q<=0?'neg':'pos')+'">'+num(i.q)+'</b> '+esc(i.u)+'</span></div>';
  $('#clr').onclick=()=>{sel=null;showPick()}}
function saveIssue(){const d=S.draft,qty=parseFloat($('#qty').value);
  if(!S.active){toast('Add a site first');return}
  if(!d.project.trim()){toast('Enter the project code');return}
  if(sel==null||!S.items[sel]){toast('Pick an item');return}
  if(!(qty>0)){toast('Enter a quantity above 0');return}
  const it=S.items[sel];
  const go=()=>{it.q=Math.round((it.q-qty)*1000)/1000;
    S.issues.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:d.date,site:S.active,project:d.project.trim(),code:it.c,name:it.n,unit:it.u,qty:qty,remarks:$('#rem').value.trim(),ts:Date.now()});
    markDirty(S.active,d.date);sel=null;toast('Saved: '+num(qty)+' '+it.u+' '+it.n);vIssue();$('#q').focus()};
  if(qty>it.q)modal('<p>Only <b>'+num(it.q)+' '+esc(it.u)+'</b> in stock. Issue '+num(qty)+' anyway?</p>',[{t:'Issue anyway',c:'pri',f:go},{t:'Cancel',c:'sec'}]);else go()}

function rowsFor(f,t,site){site=site||S.active;return S.issues.filter(x=>x.site===site&&x.date>=f&&x.date<=t).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts)}
function vLog(){const v=$('#view');
  v.innerHTML='<div class="row"><div><label>From</label><input type="date" id="lf" value="'+lf+'"></div><div><label>To</label><input type="date" id="lt" value="'+lt+'"></div></div><div id="lsum"></div>'+
  '<div class="row"><button class="pri" id="exp">Export Excel</button><button class="sec" id="mail">Email report</button></div><div id="llist"></div>';
  $('#lf').onchange=e=>{lf=e.target.value;if(lt<lf){lt=lf;$('#lt').value=lt}fillLog()};$('#lt').onchange=e=>{lt=e.target.value;fillLog()};
  $('#exp').onclick=()=>exportRange(lf,lt);$('#mail').onclick=()=>S.settings.method==='mail'?openComposer(S.active,lf,lt):sendNow();fillLog()}
function fillLog(){const r=rowsFor(lf,lt).reverse(),tot=r.reduce((a,x)=>a+x.qty,0);
  $('#lsum').innerHTML='<div class="card"><b>'+r.length+'</b> lines &middot; <b>'+new Set(r.map(x=>x.code+'|'+x.name)).size+'</b> items &middot; total qty <b>'+num(tot)+'</b></div>';
  let h='',cur='';r.forEach(x=>{if(x.date!==cur){cur=x.date;h+='<div class="day">'+nice(cur)+'</div>'}
    h+='<div class="card"><button class="x" data-del="'+x.id+'">&times;</button><b>'+esc(x.name)+'</b> &mdash; '+num(x.qty)+' '+esc(x.unit)+'<br><span class="sm">Ref <b>'+esc(x.project)+'</b>'+(x.remarks?' &middot; '+esc(x.remarks):'')+'</span></div>'});
  $('#llist').innerHTML=h||'<div class="card sm">No issues in this period.</div>';
  $('#llist').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delIssue(b.dataset.del))}
function delIssue(id){const x=S.issues.find(i=>i.id===id);if(!x)return;
  modal('<p>Delete this issue?<br><b>'+esc(x.name)+'</b> '+num(x.qty)+' '+esc(x.unit)+'<br>The quantity goes back into stock.</p>',[{t:'Delete',c:'dng',f:()=>{
    const it=S.items.find(i=>(x.code&&i.c===x.code)||(!x.code&&i.n===x.name));if(it)it.q=Math.round((it.q+x.qty)*1000)/1000;
    S.issues=S.issues.filter(i=>i.id!==id);markDirty(x.site,x.date);fillLog();toast('Deleted')}},{t:'Keep',c:'sec'}])}

function vStock(){$('#view').innerHTML='<div class="card"><b>'+S.items.length+'</b> items in stock</div>'+
  '<input type="file" id="f" accept=".xlsx,.xls,.csv" hidden><button class="pri" id="up">Upload stock (Excel / CSV)</button>'+
  '<div class="sm" style="margin-top:8px">Columns it understands: Code, Name (or Item / Description), Unit, Qty (or Stock / Balance). First sheet is used.</div>'+
  '<label>Search stock</label><input type="search" id="sq" placeholder="name or code" autocomplete="off"><div id="slist"></div>';
  $('#up').onclick=()=>$('#f').click();$('#f').onchange=importStock;$('#sq').oninput=fillStock;fillStock()}
function fillStock(){const q=($('#sq').value||'').trim();const m=q?find(q,60):S.items.slice(0,60).map((_,i)=>i);
  $('#slist').innerHTML=m.map(i=>{const x=S.items[i];return '<div class="card"><b>'+esc(x.n)+'</b><br><span class="sm">'+esc(x.c)+'</span><span style="float:right" class="'+(x.q<=0?'neg':'pos')+'"><b>'+num(x.q)+'</b> '+esc(x.u)+'</span></div>'}).join('')||'<div class="card sm">No match</div>'}
function importStock(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const items=parseSheet(rd.result);if(!items.length)throw new Error('No item rows found');
    modal('<p>Found <b>'+items.length+'</b> items in <b>'+esc(f.name)+'</b>.</p><p class="sm">Replace: the list becomes exactly this file. Add / update: matches by code (or name), updates quantity, keeps other items.</p>',
     [{t:'Replace all stock',c:'pri',f:()=>{setItems(items);done(items.length)}},{t:'Add / update',c:'sec',f:()=>{const m=new Map(S.items.map(i=>[i.c||i.n,i]));items.forEach(n=>{const k=n.c||n.n,o=m.get(k);if(o){o.n=n.n;o.u=n.u||o.u;o.q=n.q}else{S.items.push(n);m.set(k,n)}});done(items.length)}},{t:'Cancel',c:'sec'}])
  }catch(err){modal('<p>'+esc(err.message)+'</p>',[{t:'OK',c:'sec'}])}e.target.value=''};rd.readAsArrayBuffer(f)}
function done(n){reindex();save();toast(n+' items loaded');vStock()}
function parseSheet(buf){const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const nm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const K={c:['code','productcode','itemcode','sku','partno','partnumber','no','id'],n:['name','itemname','item','description','product','productname','itemdescription','itemdesc'],u:['unit','uom','unitofmeasure','units'],q:['qty','quantity','stock','balance','openingstock','onhand','instock','stockqty','qtyonhand']};
  let hi=-1,map={};for(let r=0;r<Math.min(rows.length,10);r++){const m={};rows[r].forEach((h,ci)=>{const k=nm(h);for(const f in K)if(m[f]===undefined&&K[f].indexOf(k)>=0)m[f]=ci});if(m.n!==undefined){hi=r;map=m;break}}
  if(hi<0)throw new Error('Could not find an item name column. Put headers like Code, Name, Unit, Qty in the first rows.');
  return rows.slice(hi+1).map(r=>({c:map.c!==undefined?String(r[map.c]).trim():'',n:String(r[map.n]).trim(),u:map.u!==undefined?String(r[map.u]).trim():'',q:map.q!==undefined?(parseFloat(String(r[map.q]).replace(/,/g,''))||0):0})).filter(i=>i.n)}

function vSet(){const s=S.settings,v=$('#view');
  v.innerHTML='<label>Active site (each site has its own stock and issue log)</label><select id="s_act">'+S.sites.map(x=>'<option'+(x.name===S.active?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'+
  '<div class="row"><input id="s_ns" placeholder="new site name"><button class="sec" id="s_addsite" style="margin-top:0">Add site</button></div>'+
  '<h3>Daily report (17:30)</h3><label>How to send</label><select id="s_meth"><option value="mail"'+(s.method==='mail'?' selected':'')+'>Phone\'s default mail app (opens ready - you tap Send)</option><option value="script"'+(s.method==='script'?' selected':'')+'>Gmail script (fully automatic, no tap)</option></select>'+
  '<label>Send report to (email address)</label><input id="s_mail" type="email" value="'+esc(s.email)+'" autocomplete="off">'+
  '<p class="sm">Android does not let an app send mail silently from the phone\'s own account. In mail-app mode the report opens in your default mail app at 17:30 with the Excel attached - tap Send, and the mail app delivers it as soon as there is internet.</p>'+
  '<h3>Gmail script (only for fully automatic mode)</h3><p class="sm">Each day\'s report is synced to your Gmail script and emailed at 17:30, even if this phone is off. Setup steps are in the README (tools/email-script.gs).</p>'+
  '<label>Gmail link (Apps Script web app URL)</label><input id="s_web" value="'+esc(s.webhook)+'" placeholder="https://script.google.com/macros/s/.../exec">'+
  '<label>Secret word (same as in the script)</label><input id="s_sec" value="'+esc(s.secret)+'">'+
  '<div class="card sm" id="s_stat"></div>'+
  '<button class="pri" id="s_save">Save settings</button><div class="row"><button class="sec" id="s_sync">Sync now</button><button class="sec" id="s_now">Send today\'s report now</button></div>'+
  '<h3>Backup</h3><input type="file" id="s_rf" accept=".json" hidden><div class="row"><button class="sec" id="s_bk">Backup data</button><button class="sec" id="s_rs">Restore</button></div>'+
  '<p class="sm">Reports include only what is on this phone. Back up regularly.</p>';
  $('#s_act').onchange=e=>{setActive(e.target.value);save();render();toast('Switched to '+S.active)};
  $('#s_addsite').onclick=()=>{if(addSite($('#s_ns').value)){tab='stock';render();toast('Site added - now upload its stock')}};
  const stat=()=>{$('#s_stat').innerHTML='<b>'+S.dirty.length+'</b> day(s) waiting to sync &middot; last sync: '+(s.lastSync?new Date(s.lastSync).toLocaleString():'never')};stat();
  $('#s_save').onclick=()=>{s.method=$('#s_meth').value;s.email=$('#s_mail').value.trim();s.webhook=$('#s_web').value.trim();s.secret=$('#s_sec').value.trim();save();header();toast('Settings saved');scheduleReminder();flush().then(stat);checkBanner()};
  $('#s_sync').onclick=async()=>{$('#s_save').click();if(!s.webhook){toast('Add the Gmail link first');return}await flush();stat();toast(S.dirty.length?'Not synced yet - check internet / link / secret':'Synced')};
  $('#s_now').onclick=async()=>{$('#s_save').click();await sendNow();stat()};
  $('#s_bk').onclick=()=>{const j=JSON.stringify(Object.assign({},S,{items:undefined}));deliver('StockIssuing_backup_'+today()+'.json',btoa(unescape(encodeURIComponent(j))),'application/json')};
  $('#s_rs').onclick=()=>$('#s_rf').click();
  $('#s_rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.sites||!o.issues)throw 0;
    modal('<p>Replace everything on this phone with this backup ('+o.sites.length+' sites, '+o.issues.length+' issues)?</p>',[{t:'Restore',c:'dng',f:()=>{S=Object.assign({},DEF,o);S.settings=Object.assign({},DEF.settings,o.settings);S.draft=Object.assign({},DEF.draft,o.draft);S.sites=S.sites||[];if(!S.sites.some(x=>x.name===S.active))S.active=S.sites.length?S.sites[0].name:'';S.items=S.active?activeSite().items:[];reindex();save();toast('Restored');render()}},{t:'Cancel',c:'sec'}])}catch(x){toast('That is not a valid backup file')}e.target.value=''};r.readAsText(f)}}

/* ---------- reports ---------- */
function serial(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000+25569}
function makeBook(rows){const wb=XLSX.utils.book_new();
  const a=[['Date','Site','Project Code','Item Issued','Quantity','Unit','Item Code','Remarks']].concat(rows.map(x=>[serial(x.date),x.site,x.project,x.name,x.qty,x.unit,x.code,x.remarks]));
  const w1=XLSX.utils.aoa_to_sheet(a);for(let r=1;r<a.length;r++){const c=w1['A'+(r+1)];c.t='n';c.z='dd-mmm-yyyy'}
  w1['!cols']=[{wch:13},{wch:18},{wch:16},{wch:40},{wch:10},{wch:8},{wch:14},{wch:28}];XLSX.utils.book_append_sheet(wb,w1,'Issues');
  const I={};rows.forEach(x=>{const k=x.site+'|'+x.project+'|'+x.code+'|'+x.name,g=I[k]=I[k]||[x.site,x.project,x.code,x.name,x.unit,0];g[5]+=x.qty});
  const w2=XLSX.utils.aoa_to_sheet([['Site','Project Code','Item Code','Item','Unit','Total Qty']].concat(Object.values(I)));w2['!cols']=[{wch:18},{wch:16},{wch:14},{wch:40},{wch:8},{wch:12}];XLSX.utils.book_append_sheet(wb,w2,'By Item');
  return wb}
function fname(f,t,site){return (site||S.active||'Site').replace(/[^\w\-]+/g,'_')+'_Issues_'+(f===t?f:f+'_to_'+t)+'.xlsx'}
function b64Of(f,t,site){return XLSX.write(makeBook(rowsFor(f,t,site)),{bookType:'xlsx',type:'base64'})}
const XL='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
async function deliver(name,b64,mime){const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});const u=await C.Plugins.Filesystem.getUri({path:name,directory:'CACHE'});
      await C.Plugins.Share.share({title:name,url:u.uri,dialogTitle:'Send or save'});return}catch(e){if(e&&/cancel/i.test(String(e.message||e)))return;toast('Share failed: '+(e.message||e));return}}
  const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([arr],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportRange(f,t){const r=rowsFor(f,t);if(!r.length){toast('Nothing to export for these dates');return}deliver(fname(f,t),b64Of(f,t),XL)}
/* ---------- sync to Gmail script (it emails the report at 17:30) ---------- */
function payloadFor(d){const rows=rowsFor(d.date,d.date,d.site);return rows.length?{action:'report',site:d.site,date:d.date,lines:rows.length,filename:fname(d.date,d.date,d.site),base64:b64Of(d.date,d.date,d.site)}:{action:'clear',site:d.site,date:d.date}}
function bgSet(){const C=window.Capacitor;if(!(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.BackgroundRunner))return;
  const u=S.settings.webhook,sec=S.settings.secret;
  const list=u?S.dirty.map(d=>({key:d.site+'|'+d.date,url:u,body:JSON.stringify(Object.assign({secret:sec},payloadFor(d)))})):[];
  try{C.Plugins.BackgroundRunner.dispatchEvent({label:'com.stockissuing.app.check',event:'setPending',details:{list:list}}).catch(function(){})}catch(e){}}
function markDirty(site,date){if(!S.dirty.some(x=>x.site===site&&x.date===date))S.dirty.push({site:site,date:date});save();bgSet();setTimeout(flush,1200);checkBanner()}
let flushing=false;
async function post(payload){const u=S.settings.webhook,body=JSON.stringify(Object.assign({secret:S.settings.secret},payload)),h={'Content-Type':'text/plain;charset=utf-8'};
  try{const r=await fetch(u,{method:'POST',headers:h,body:body});return await r.json()}
  catch(e){try{await fetch(u,{method:'POST',mode:'no-cors',headers:h,body:body});return {ok:true,blind:true}}catch(e2){return null}}}
async function flush(){if(flushing||!S.settings.webhook||!navigator.onLine||!S.dirty.length)return;flushing=true;
  try{for(const d of S.dirty.slice()){const j=await post(payloadFor(d));
    if(j&&j.ok){S.dirty=S.dirty.filter(x=>!(x.site===d.site&&x.date===d.date));S.settings.lastSync=Date.now();save()}else{if(j&&j.error)toast('Sync: '+j.error);break}}}
  finally{flushing=false;bgSet();checkBanner()}}
async function sendNow(){if(S.settings.method==='mail'){openComposer(S.active,today(),today());return}if(!S.settings.webhook){toast('Add the Gmail link in Settings first');return}if(!navigator.onLine){toast('No internet connection');return}
  const t=today();if(!rowsFor(t,t).length){toast('No issues today for this site');return}
  if(!S.dirty.some(x=>x.site===S.active&&x.date===t))S.dirty.push({site:S.active,date:t});
  await flush();if(S.dirty.some(x=>x.site===S.active&&x.date===t)){toast('Could not sync - check the link and secret');return}
  const j=await post({action:'sendnow',site:S.active,date:t});toast(j&&j.ok&&j.sent?'Report emailed':(j&&j.error?'Send failed: '+j.error:'Could not send'))}
function mailDue(){const st=S.settings,n=new Date();if((pad(n.getHours())+':'+pad(n.getMinutes()))<st.sendTime)return[];
  return S.sites.map(x=>x.name).filter(nm=>st.sentMail[nm]!==today()&&rowsFor(today(),today(),nm).length>0)}
async function openComposer(site,f,t){const s=S.settings,rows=rowsFor(f,t,site);
  if(!rows.length){toast('No issues for these dates');return}
  if(!s.email){toast('Enter the report email in Settings first');tab='set';render();return}
  const b64=b64Of(f,t,site),name=fname(f,t,site),C=window.Capacitor,EC=C&&C.Plugins&&C.Plugins.EmailComposer;
  if(f===today()&&t===today()){s.sentMail[site]=today();save()}
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&EC){try{await EC.open({to:[s.email],subject:site+' - stock issue report '+(f===t?nice(f):nice(f)+' to '+nice(t)),body:'Stock issue report for '+site+' ('+rows.length+' lines) attached.',attachments:[{type:'base64',path:b64,name:name}]})}catch(e){toast('Could not open the mail app: '+(e&&e.message||e))}}
  else await deliver(name,b64,XL);
  checkBanner()}
function tickMail(){const s=S.settings;if(s.method!=='mail'||!s.email||document.hidden||!$('#modal').hidden)return;const d=mailDue();if(d.length)openComposer(d[0],today(),today())}
async function scheduleReminder(){const C=window.Capacitor,LN=C&&C.Plugins&&C.Plugins.LocalNotifications;if(!(C&&C.isNativePlatform&&C.isNativePlatform()&&LN))return;
  try{await LN.cancel({notifications:[{id:1730}]});if(S.settings.method!=='mail')return;const p=await LN.requestPermissions();if(p.display!=='granted')return;
    const hm=S.settings.sendTime.split(':').map(Number);
    await LN.schedule({notifications:[{id:1730,title:'Stock report due',body:'Tap to send today\'s issue report',schedule:{on:{hour:hm[0],minute:hm[1]},allowWhileIdle:true}}]})}catch(e){}}
function checkBanner(){const b=$('#banner');if(!S.active){b.hidden=true;return}
  if(S.settings.method==='mail'){const d=mailDue();
    if(!S.settings.email&&S.issues.length){b.hidden=false;b.textContent='Add the report email in Settings to get the daily report.';b.onclick=()=>{tab='set';render()};return}
    if(d.length){b.hidden=false;b.textContent='Report for '+d[0]+' is ready - tap to open your mail app';b.onclick=()=>openComposer(d[0],today(),today());return}
    b.hidden=true;return}
  if(!S.settings.webhook){b.hidden=!S.issues.length;b.textContent='Reports are NOT being emailed yet. Tap to add the Gmail link in Settings.';b.onclick=()=>{tab='set';render()};return}
  if(S.dirty.length&&!navigator.onLine){b.hidden=false;b.textContent=S.dirty.length+' day(s) waiting to sync - will send when online';b.onclick=null;return}
  b.hidden=true}
async function tick(){await flush();tickMail();checkBanner()}
window.addEventListener('online',tick);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});setInterval(tick,30000);

/* ---------- boot ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();tick();scheduleReminder();
</script>
</body>
</html>
